<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#3b82f6;#10b981;#8b5cf6;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#06b6d4;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#10b981;#ec4899;#6366f1;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #38bdf8;
    }
    .metric-lbl {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1150" y1="0" x2="1150" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Animated Glowing Orbs -->
  <circle cx="150" cy="100" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;140;100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1000;1050" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Content: Branding & Text -->
  <g transform="translate(60, 60)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#1e293b" stroke="url(#neonAccent)" stroke-width="1.5" />
    <circle cx="16" cy="17" r="5" fill="#10b981">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="22" class="badge-text">SALES COMPENSATION HUB</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome <tspan fill="url(#neonAccent)">Sales Compensation</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      The Curated Guide for ICM, Commission Engines, Quota Modeling &amp; SPM
    </text>

    <!-- Key Badges -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="175" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" class="badge-text">⚡ Top SaaS Platforms</text>
      
      <rect x="190" y="0" width="190" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="204" y="24" class="badge-text">🛠️ Open-Source Engines</text>
      
      <rect x="395" y="0" width="175" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="409" y="24" class="badge-text">📊 Valuation &amp; Pricing</text>
    </g>
  </g>

  <!-- Right Floating Visuals / Dashboard Card -->
  <g class="floating-card" transform="translate(770, 50)">
    <rect width="370" height="300" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" filter="url(#softGlow)"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#eab308"/>
    <circle cx="56" cy="24" r="5" fill="#22c55e"/>
    <text x="80" y="28" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">SPM Payout &amp; Quota Attainment</text>

    <!-- Metric Cards -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" class="metric-lbl">EST. MARKET SIZE</text>
      <text x="14" y="50" class="metric-val">$3.75B+</text>

      <rect x="165" y="0" width="155" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="179" y="26" class="metric-lbl">GROWTH (CAGR)</text>
      <text x="179" y="50" class="metric-val" fill="#10b981">+15.8%</text>

      <!-- Mini Chart -->
      <g transform="translate(0, 80)">
        <rect width="320" height="130" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="14" y="25" class="metric-lbl">COMMISSION ATTAINMENT RUN-RATE</text>
        
        <rect x="20" y="80" width="28" height="35" rx="4" fill="#6366f1" opacity="0.6"/>
        <rect x="65" y="65" width="28" height="50" rx="4" fill="#6366f1" opacity="0.75"/>
        <rect x="110" y="50" width="28" height="65" rx="4" fill="#8b5cf6" opacity="0.85"/>
        <rect x="155" y="40" width="28" height="75" rx="4" fill="#a855f7" opacity="0.9"/>
        <rect x="200" y="30" width="28" height="85" rx="4" fill="#06b6d4"/>
        <rect x="245" y="15" width="28" height="100" rx="4" fill="url(#neonAccent)"/>

        <path d="M 34 85 L 79 70 L 124 55 L 169 45 L 214 35 L 259 20" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="259" cy="20" r="4" fill="#ffffff" filter="url(#glow)">
          <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#neonAccent)"/>
</svg>